packages:
  [
    "packages/core",
    "packages/theme",
    "packages/react",
    "packages/unocss",
    "website",
  ]

minimumReleaseAge: 10080 # 7 日
minimumReleaseAgeExclude:
  - call-fn-once

blockExoticSubdeps: true

trustPolicy: no-downgrade
trustPolicyExclude:
  - "@pierre/theme"
  - "@vercel/*"
  - "chokidar"
  - "semver"
  - "undici-types"

strictDepBuilds: true
onlyBuiltDependencies: []
allowBuilds:
  esbuild: true

update:
  ignoreDeps:
    - "*" # パッケージの更新は ncu に任せます。

overrides:
  dompurify: 3.4.17
