minimumReleaseAge: 10080 # 7 日
minimumReleaseAgeExclude: []
onlyBuiltDependencies: []
strictDepBuilds: false
blockExoticSubdeps: true
trustPolicy: no-downgrade
trustPolicyExclude:
  - semver
  # blume
  - "@hono/node-server"
  - "@pierre/theme"
  - "chokidar"
allowBuilds:
  esbuild: true
packages: ["packages/core", "packages/theme", "packages/react", "website"]
