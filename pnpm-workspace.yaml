minimumReleaseAge: 10080 # 7 日
minimumReleaseAgeExclude: []
onlyBuiltDependencies: []
strictDepBuilds: false
blockExoticSubdeps: true
trustPolicy: no-downgrade
trustPolicyExclude:
  - semver
  # blume
  - "@hono/node-server"
  - "@pierre/theme"
  - "chokidar"
allowBuilds:
  esbuild: true
update:
  ignoreDeps:
    - "*" # パッケージの更新は ncu に任せる
packages: ["packages/core", "packages/theme", "packages/unocss", "packages/react", "website"]
