[tasks.test]
run = [{ task = "test:server" }, { task = "test:client" }, { task = "test:check" }]
env = { CI = 1 }

[tasks."test:server"]
run = "pnpm exec vp test --config ./.config/vite.server.config.ts"

[tasks."test:client"]
run = "pnpm exec vp test --config ./.config/vite.client.config.ts"

[tasks."test:coverage"]
run = [{ task = "test:coverage:server" }, { task = "test:coverage:client" }]
env = { CI = 1 }

[tasks."test:coverage:server"]
run = "pnpm exec vp test run --coverage --config ./.config/vite.server.config.ts"

[tasks."test:coverage:client"]
run = "pnpm exec vp test run --coverage --config ./.config/vite.client.config.ts"

[tasks."test:check"]
run = [
  "node ./scripts/sort-css-variables.ts --check",
  "node ./scripts/sort-namespace-exports.ts --check",
  "pnpm exec vp check",
  "pnpm exec stylelint './src/**/*.css' --config ./.config/.stylelintrc.json",
]

[tasks.check]
run = [
  "node ./scripts/sort-css-variables.ts",
  "node ./scripts/sort-namespace-exports.ts",
  "pnpm exec vp check --fix",
  "pnpm exec stylelint './src/**/*.css' --config ./.config/.stylelintrc.json --fix",
]

[tasks.update]
run = []

[tasks.dev]
run = "npx storybook dev --config-dir ./.config/storybook --port 6006"
