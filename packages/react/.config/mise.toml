[tasks.test]
run = [
  { task = "test:server" },
  { task = "test:client" },
  { task = "test:format" },
  { task = "test:lint" },
  { task = "test:typecheck" },
]
env = { CI = 1 }

[tasks."test:server"]
run = "npx vitest --config ./.config/vitest.server.ts"

[tasks."test:client"]
run = "npx vitest --config ./.config/vitest.client.ts"

[tasks."test:format"]
run = [
  "npx oxfmt --config ./.config/.oxfmtrc.json --check",
  "node scripts/sort-jsx-props.ts --check",
  "node scripts/sort-import-exports.ts --check",
  "node scripts/sort-type-props.ts --check",
  "node scripts/sort-namespace-exports.ts --check",
]

[tasks."test:lint"]
run = "npx oxlint --config ./.config/.oxlintrc.json"

[tasks."test:typecheck"]
run = [
  "npx tsc --noEmit --project ./.config/tsconfig.base.json",
  "npx tsc --noEmit --project ./.config/tsconfig.test.json",
  "npx tsc --noEmit --project ./.config/tsconfig.client.json",
  "npx tsc --noEmit --project ./.config/tsconfig.server.json",
  "npx tsc --noEmit --project ./.config/tsconfig.config.json",
]

[tasks.format]
run = [
  { task = "format:oxfmt" },
  { task = "format:stylelint" },
  { task = "format:sort-jsx-props" },
  { task = "format:sort-import-exports" },
  { task = "format:sort-type-props" },
  { task = "format:sort-namespace-exports" },
]

[tasks."format:oxfmt"]
run = "npx oxfmt --config ./.config/.oxfmtrc.json"

[tasks."format:stylelint"]
run = "npx stylelint --config ./.config/.stylelintrc.json --fix 'src/**/*.css'"

[tasks."format:sort-jsx-props"]
run = "node scripts/sort-jsx-props.ts"

[tasks."format:sort-import-exports"]
run = "node scripts/sort-import-exports.ts"

[tasks."format:sort-type-props"]
run = "node scripts/sort-type-props.ts"

[tasks."format:sort-namespace-exports"]
run = "node scripts/sort-namespace-exports.ts"

[tasks.lint]
run = "npx oxlint --config ./.config/.oxlintrc.json"

[tasks.update]
run = [
  "npx npm-check-updates --target minor -u --cooldown 7",
  "pnpm install",
  "pnpm dlx playwright install --with-deps",
]

[tasks.dev]
run = "npx storybook dev --config-dir ./.config/storybook --port 6006"
