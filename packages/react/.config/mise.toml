[tasks.test]
run = [
  { task = "test:server" },
  { task = "test:client" },
  { task = "test:format" },
  { task = "test:lint" },
  { task = "test:typecheck" },
]
env = { CI = 1 }

[tasks."test:server"]
run = "npx vitest --config ./.config/vitest.server.ts"

[tasks."test:client"]
run = "npx vitest --config ./.config/vitest.client.ts"

[tasks."test:format"]
run = [
  { task = "test:format:oxfmt" },
  { task = "test:format:extra" },
  { task = "test:format:style" },
]

[tasks."test:format:oxfmt"]
run = { task = "format:oxfmt", args = ["--check"] }

[tasks."test:format:extra"]
run = [
  "node ./scripts/sort-jsx-props.ts --check",
  "node ./scripts/sort-object-props.ts --check",
  "node ./scripts/sort-type-props.ts --check",
  "node ./scripts/sort-import-exports.ts --check",
  "node ./scripts/sort-namespace-exports.ts --check",
]

[tasks."test:format:style"]
run = [
  "node ./scripts/sort-css-variables.ts --check",
  "npx stylelint --config ./.config/.stylelintrc.json './src/**/*.css'",
]

[tasks."test:lint"]
run = { task = "lint" }

[tasks."test:typecheck"]
run = [
  "npx tsc --noEmit --project ./.config/tsconfig.base.json",
  "npx tsc --noEmit --project ./.config/tsconfig.test.json",
  "npx tsc --noEmit --project ./.config/tsconfig.client.json",
  "npx tsc --noEmit --project ./.config/tsconfig.server.json",
  "npx tsc --noEmit --project ./.config/tsconfig.config.json",
]

[tasks.format]
run = [{ task = "format:oxfmt" }, { task = "format:extra" }, { task = "format:style" }]

[tasks."format:oxfmt"]
run = "set -e; cp ./.config/.oxfmtrc.json ./.tmp-oxfmtrc.json; trap 'rm -f ./.tmp-oxfmtrc.json' EXIT; npx oxfmt --config ./.tmp-oxfmtrc.json"

[tasks."format:extra"]
run = [
  "node ./scripts/sort-jsx-props.ts",
  "node ./scripts/sort-object-props.ts",
  "node ./scripts/sort-type-props.ts",
  "node ./scripts/sort-import-exports.ts",
  "node ./scripts/sort-namespace-exports.ts",
]

[tasks."format:style"]
run = [
  "node ./scripts/sort-css-variables.ts",
  "npx stylelint --config ./.config/.stylelintrc.json './src/**/*.css' --fix",
]

[tasks.lint]
run = "set -e; cp ./.config/.oxlintrc.json ./.tmp-oxlintrc.json; trap 'rm -f ./.tmp-oxlintrc.json' EXIT; npx oxlint --config ./.tmp-oxlintrc.json"

[tasks.update]
run = [
  "npx npm-check-updates --target minor -u --cooldown 7",
  "pnpm install",
  "npx playwright install --with-deps",
]

[tasks.dev]
run = "npx storybook dev --config-dir ./.config/storybook --port 6006"
