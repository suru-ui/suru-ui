name: "パッケージを公開"

on:
  workflow_dispatch:
    inputs:
      version:
        description: "バージョン (e.g., 1.2.3)"
        required: true

defaults:
  run:
    shell: bash -euo pipefail {0}

jobs:
  publish:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - name: "チェックアウト"
        uses: actions/checkout@v4

      - name: "Bun をセットアップ"
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: "Node.js をセットアップ"
        uses: volta-cli/action@v4
        with:
          registry-url: "https://registry.npmjs.org"

      - name: "依存関係をインストール"
        run: bun i

      - name: "ビルド"
        run: npm run build

      - name: "バージョンを更新"
        run: |
          for dir in packages/*; do
            pkg="$dir/package.json"

            if [ -f "$pkg" ] && ! jq -e '.private == true' "$pkg" > /dev/null; then
              jq --arg version '${{ github.event.inputs.version }}' '
                .version = $version |
                (if .dependencies then .dependencies |= map_values(if . == "workspace:*" then $version else . end) else . end)
              ' "$pkg" > tmp.json
              mv tmp.json "$pkg"

              echo "$pkg"
              cat "$pkg"
              echo
            fi
          done

      - name: "タグうち"
        run: |
          git tag v${{ github.event.inputs.version }}
          git push origin v${{ github.event.inputs.version }}

      - name: "公開"
        shell: bash -e {0}
        run: |
          failed_packages=()

          publish_with_retry() {
            local dir="$1"
            local delay=10
            local attempts=10

            for ((i=1; i<=attempts; i++)); do
              echo "Publishing $dir (Attempt $i/$attempts)..."
              (cd "$dir" && npm publish --access public) && return 0

              echo "Publish failed. Retrying in $delay seconds..."
              sleep $delay
            done

            echo "Failed to publish $dir after $attempts attempts."
            failed_packages+=("$dir")
            return 1
          }

          for dir in packages/*; do
            pkg="$dir/package.json"
            if [ -f "$pkg" ] && ! jq -e '.private == true' "$pkg" > /dev/null; then
              publish_with_retry "$dir"
              sleep 5
            fi
          done

          if [ ${#failed_packages[@]} -ne 0 ]; then
            echo
            echo "The following packages failed to publish:"
            for pkg in "${failed_packages[@]}"; do
              echo "- $pkg"
            done
            exit 1
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
