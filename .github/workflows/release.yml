name: "リリース"
run-name: "リリース ${{ inputs.dry-run && '[dry-run] ' || '' }}${{ github.event.inputs.version }}"

on:
  workflow_dispatch:
    inputs:
      version:
        description: "バージョン（例:「1.2.3」「package-name@1.2.3」）"
        required: true
      dry-run:
        description: "公開せずに検証のみ行う（コミット・タグ・Release・npm 公開を省略）"
        required: false
        type: boolean
        default: false
      skip-checks:
        description: "静的検証・テストを省略する（CI 済みの場合用）"
        required: false
        type: boolean
        default: false

defaults:
  run:
    shell: bash -euo pipefail {0}

concurrency:
  group: "release"
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write

jobs:
  test:
    if: inputs.skip-checks != true
    timeout-minutes: 30
    runs-on: ubuntu-latest
    # ブラウザーはコンテナーに同梱されているため、playwright install（apt 実行）を行わない。
    # タグの版は scripts/update-playwright-image.mjs が catalog に合わせて更新する。
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
    env:
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
    steps:
      - name: "チェックアウト"
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: "HOME の所有権を修正"
        # GitHub はコンテナー内の HOME を /github/home に上書きする。
        # 所有者が実行ユーザーと異なると Firefox が起動できないため、最初に揃える。
        run: chown -R "$(id -u):$(id -g)" "$HOME"

      - name: "mise をセットアップ"
        uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # v3.6.3

      - name: "依存関係をインストール"
        run: pnpm install --frozen-lockfile

      - name: "ビルド"
        run: node scripts/release/each-workspace.mjs build

      - name: "ルートの検証"
        run: mise run test:check

      - name: "静的検証"
        run: node scripts/release/each-workspace.mjs check

      - name: "テスト"
        run: node scripts/release/each-workspace.mjs test

  release:
    needs: test
    if: ${{ always() && (needs.test.result == 'success' || needs.test.result == 'skipped') }}
    timeout-minutes: 60
    runs-on: ubuntu-latest
    outputs:
      changelog: ${{ steps.changelog.outputs.changelog }}
      packages: ${{ steps.packages.outputs.list }}
    steps:
      - name: "バージョン解析"
        id: pkg
        uses: tai-kun/gha-package-version-parser@dd1d3b95150181171e03b6bc31dc090bd67e07e0 # v1.0.0
        with:
          package: ${{ github.event.inputs.version }}

      - name: "チェックアウト"
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0

      - name: "mise をセットアップ"
        uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # v3.6.3

      - name: "依存関係をインストール"
        run: |
          node --version
          pnpm --version
          npm --version
          pnpm install --frozen-lockfile

      - name: "ワークスペース定義の検証（チェック省略時）"
        if: inputs.skip-checks == true
        run: |
          node scripts/sort-workspaces.mjs
          node scripts/check-workspaces.mjs

      - name: "ビルド"
        run: node scripts/release/each-workspace.mjs build

      - name: "公開パッケージを決定"
        id: packages
        env:
          PACKAGE_NAME: ${{ steps.pkg.outputs.name }}
          VERSION: ${{ steps.pkg.outputs.version }}
        run: node scripts/release/determine-packages.mjs

      - name: "npm レジストリーを確認"
        if: steps.packages.outputs.count != '0'
        env:
          LIST: ${{ steps.packages.outputs.list }}
        run: node scripts/release/check-npm.mjs

      - name: "バージョンを更新"
        if: steps.packages.outputs.count != '0' && inputs.dry-run != true
        env:
          LIST: ${{ steps.packages.outputs.list }}
        run: node scripts/release/bump-versions.mjs

      - name: "CHANGELOG を生成"
        id: changelog
        if: steps.packages.outputs.count != '0'
        env:
          FIRST_TAG: ${{ steps.packages.outputs.first_tag }}
          RELEASE_VERSION: ${{ steps.packages.outputs.version }}
          RELEASE_COUNT: ${{ steps.packages.outputs.count }}
          RUNNER_TEMP: ${{ runner.temp }}
        run: node scripts/release/make-changelog-entry.mjs

      - name: "CHANGELOG.md に追記"
        if: steps.packages.outputs.count != '0' && inputs.dry-run != true
        env:
          RUNNER_TEMP: ${{ runner.temp }}
        run: node scripts/release/append-changelog.mjs

      - name: "更新をコミット"
        id: commit
        if: steps.packages.outputs.count != '0' && inputs.dry-run != true
        env:
          LIST: ${{ steps.packages.outputs.list }}
          MESSAGE: ${{ steps.packages.outputs.message }}
          BRANCH: ${{ github.ref_name }}
        run: node scripts/release/commit.mjs

      - name: "タグを作成"
        if: steps.packages.outputs.count != '0' && inputs.dry-run != true
        env:
          LIST: ${{ steps.packages.outputs.list }}
          RELEASE_COUNT: ${{ steps.packages.outputs.count }}
          RELEASE_TAG: ${{ steps.packages.outputs.release_tag }}
        run: node scripts/release/create-tags.mjs

      - name: "Release を作成"
        if: steps.packages.outputs.count != '0' && inputs.dry-run != true
        env:
          LIST: ${{ steps.packages.outputs.list }}
          RELEASE_COUNT: ${{ steps.packages.outputs.count }}
          RELEASE_TAG: ${{ steps.packages.outputs.release_tag }}
          RELEASE_VERSION: ${{ steps.packages.outputs.version }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUNNER_TEMP: ${{ runner.temp }}
        run: node scripts/release/create-releases.mjs

      - name: "npm に公開"
        if: steps.packages.outputs.count != '0' && inputs.dry-run != true
        env:
          LIST: ${{ steps.packages.outputs.list }}
          RUNNER_TEMP: ${{ runner.temp }}
        run: node scripts/release/publish-npm.mjs

      - name: "リリース結果を表示"
        if: success() && steps.packages.outputs.count != '0' && inputs.dry-run != true
        env:
          LIST: ${{ steps.packages.outputs.list }}
          RELEASE_COUNT: ${{ steps.packages.outputs.count }}
          RELEASE_TAG: ${{ steps.packages.outputs.release_tag }}
        run: node scripts/release/write-summary.mjs result

      - name: "ドライラン結果を表示"
        if: inputs.dry-run == true && steps.packages.outputs.count != '0'
        env:
          LIST: ${{ steps.packages.outputs.list }}
          MESSAGE: ${{ steps.packages.outputs.message }}
          CHANGELOG: ${{ steps.changelog.outputs.changelog }}
          FIRST_TAG: ${{ steps.packages.outputs.first_tag }}
          RELEASE_COUNT: ${{ steps.packages.outputs.count }}
          RELEASE_TAG: ${{ steps.packages.outputs.release_tag }}
          RELEASE_VERSION: ${{ steps.packages.outputs.version }}
          NON_PRIVATE: ${{ steps.packages.outputs.non_private }}
        run: node scripts/release/write-summary.mjs dry-run

      - name: "失敗時に npm 公開を取り消し"
        if: failure() || cancelled()
        env:
          RUNNER_TEMP: ${{ runner.temp }}
        run: node scripts/release/rollback-npm.mjs

      - name: "失敗時にタグと Release を削除"
        if: failure() || cancelled()
        env:
          LIST: ${{ steps.packages.outputs.list }}
          RELEASE_COUNT: ${{ steps.packages.outputs.count }}
          RELEASE_TAG: ${{ steps.packages.outputs.release_tag }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/release/rollback-tags.mjs

      - name: "失敗時に release コミットを取り消し"
        if: (failure() || cancelled()) && steps.commit.outputs.committed == 'true'
        env:
          COMMIT_SHA: ${{ steps.commit.outputs.sha }}
          COMMIT_BRANCH: ${{ steps.commit.outputs.branch }}
        run: node scripts/release/rollback-commit.mjs

      - name: "pnpm ログをアップロード"
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: pnpm-logs-publish
          path: |
            /home/runner/.pnpm-debug.log
            ~/.pnpm-debug.log
            **/pnpm-debug.log
          if-no-files-found: ignore
          retention-days: 3
