name: "パッケージを公開"

on:
  workflow_dispatch:
    inputs:
      version:
        description: "バージョン (e.g., 1.2.3)"
        required: true

defaults:
  run:
    shell: bash -euo pipefail {0}

jobs:
  publish:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - name: "チェックアウト"
        uses: actions/checkout@v4

      - name: "Bun をセットアップ"
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: "Node.js をセットアップ"
        uses: volta-cli/action@v4

      - name: "依存関係をインストール"
        run: bun i

      - name: "ビルド"
        run: npm run build

      - name: "バージョンを更新"
        run: |
          for dir in packages/*; do
            pkg="$dir/package.json"

            if [ -f "$pkg" ] && ! jq -e '.private == true' "$pkg" > /dev/null; then
              jq --arg version '${{ github.event.inputs.version }}' '
                .version = $version |
                (if .dependencies then .dependencies |= with_entries(select(.value == "workspace:*") | .value = $version) else . end) |
                (if .devDependencies then .devDependencies |= with_entries(select(.value == "workspace:*") | .value = $version) else . end)
              ' "$pkg" > tmp.json
              mv tmp.json "$pkg"

              echo "$pkg"
              cat "$pkg"
              echo
            fi
          done

      - name: "公開"
        run: |
          for dir in packages/*; do
            pkg="$dir/package.json"

            if [ -f "$pkg" ] && ! jq -e '.private == true' "$pkg" >/dev/null; then
              echo "Publishing $dir..."

              (cd "$dir" && npm publish --access public)
            fi
          done
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
