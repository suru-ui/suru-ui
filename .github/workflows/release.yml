name: "パッケージを公開"

on:
  workflow_dispatch:
    inputs:
      version:
        description: "バージョン (e.g., 1.2.3)"
        required: true

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: "チェックアウト"
        uses: actions/checkout@v4

      - name: "Bun をセットアップ"
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: "Node.js をセットアップ"
        uses: volta-cli/action@v4

      - name: Update package versions
        run: |
          for dir in packages/*; do
            if [ -f "$dir/package.json" ]; then
              jq --arg version "${{ github.event.inputs.version }}" '.version = $version' "$dir/package.json" > tmp.json && mv tmp.json "$dir/package.json"
            fi
          done

      - name: "依存関係をインストール"
        run: |
          bun i

      - name: "ビルド"
        run: npm run build

      - name: "公開"
        run: |
          for dir in packages/*; do
            if [ -f "$dir/package.json" ]; then
              echo "公開中 $dir..."
              (cd "$dir" && npm publish --access public)
            fi
          done
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
