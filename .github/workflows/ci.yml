name: CI

on:
  push:
    branches:
      - main

defaults:
  run:
    shell: bash -euo pipefail {0}

jobs:
  test:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - name: "チェックアウト"
        uses: actions/checkout@v4

      - name: "Bun をセットアップ"
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: "Node.js をセットアップ"
        uses: volta-cli/action@v4

      - name: "依存関係をインストール"
        run: |
          bun i
          npx playwright install --with-deps

      - name: "ビルド"
        run: npm run build

      - name: "実行"
        run: npm run test
