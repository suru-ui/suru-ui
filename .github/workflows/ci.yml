name: CI

on:
  push:
    branches:
      - main
  pull_request:

defaults:
  run:
    shell: bash -euo pipefail {0}

permissions:
  contents: read

jobs:
  setup:
    timeout-minutes: 5
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - name: "チェックアウト"
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: "テスト matrix を生成"
        id: matrix
        run: |
          matrix="$(node scripts/list-ci-matrix.mjs)"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  check:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - name: "チェックアウト"
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: "mise をセットアップ"
        uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # v3.6.3

      - name: "pnpm のストアパスを取得"
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: "pnpm のキャッシュを復元"
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-

      - name: "依存関係をインストール"
        run: pnpm install --frozen-lockfile

      - name: "内部パッケージのビルド"
        # ルートの検証は各ワークスペースのソースも型チェックするため、内部パッケージの型定義を先に生成します。
        run: pnpm --filter './packages/**' run build

      - name: "ルートの検証"
        run: mise run test:check

  test:
    needs: setup
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.setup.outputs.matrix) }}
    timeout-minutes: 30
    runs-on: ubuntu-latest
    # ブラウザーはコンテナーに同梱されているため、playwright install（apt 実行）を行わない。
    # タグの版は scripts/update-playwright-image.mjs が catalog に合わせて更新する。
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
    env:
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
    steps:
      - name: "チェックアウト"
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: "HOME の所有権を修正"
        # GitHub はコンテナー内の HOME を /github/home に上書きする。
        # 所有者が実行ユーザーと異なると Firefox が起動できないため、最初に揃える。
        run: chown -R "$(id -u):$(id -g)" "$HOME"

      - name: "mise をセットアップ"
        uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # v3.6.3

      - name: "pnpm のストアパスを取得"
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: "pnpm のキャッシュを復元"
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-

      - name: "依存関係をインストール（ルート）"
        run: pnpm install --frozen-lockfile

      - name: "内部依存パッケージのビルド"
        run: node scripts/ci/build-dependencies.mjs "${{ matrix.package.directory }}"

      - name: "テスト準備"
        run: |
          if [ -f ./scripts/pretest.sh ]; then
            bash -euo pipefail ./scripts/pretest.sh
          fi
        working-directory: ${{ matrix.package.directory }}

      - name: "ビルド"
        run: pnpm run build
        working-directory: ${{ matrix.package.directory }}

      - name: "パッケージの検証"
        run: mise run test:check
        working-directory: ${{ matrix.package.directory }}

      - name: "テストとカバレッジ"
        run: mise run test:coverage
        working-directory: ${{ matrix.package.directory }}

      - name: "カバレッジをアップロード"
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: coverage-${{ matrix.package.name }}
          path: ${{ matrix.package.directory }}/coverage
          if-no-files-found: error
          retention-days: 7

  package:
    needs:
      - check
      - test
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - name: "チェックアウト"
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: "mise をセットアップ"
        uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # v3.6.3

      - name: "pnpm のストアパスを取得"
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: "pnpm のキャッシュを復元"
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-

      - name: "依存関係をインストール"
        run: pnpm install --frozen-lockfile

      - name: "ビルド"
        run: pnpm --filter './packages/**' run build

      - name: "パッケージ検証"
        run: node scripts/ci/verify-packages.mjs
        env:
          RUNNER_TEMP: ${{ runner.temp }}
