[tasks.test]
run = [{ task = "test:server" }, { task = "test:check" }]
env = { CI = 1 }

[tasks."test:server"]
run = "pnpm exec vp test --config ./.config/vite.config.ts"

[tasks."test:coverage"]
run = "pnpm exec vp test run --coverage --config ./.config/vite.config.ts"
env = { CI = 1 }

[tasks."test:check"]
run = "pnpm exec vp check"

[tasks.check]
run = "pnpm exec vp check --fix"

[tasks.update]
run = []
