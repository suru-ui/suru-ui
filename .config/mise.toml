[settings]
minimum_release_age = "7d"

[tools]
gh = "2"
node = "24"
pnpm = "11"

[tasks.init]
description = "テンプレートを初期化します"
run = "node scripts/init/run.mjs"

[tasks.create]
description = "scripts/templates からパッケージを追加します"
run = "node scripts/create/run.mjs"

[tasks.test]
run = [
  { task = "test:check" },
  "for d in $(jq -r '.workspaces[]' package.json); do (cd $d && mise test); done",
]
env = { CI = 1 }

[tasks."test:check"]
run = [
  "pnpm exec vp check",
  "node scripts/sort-workspaces.mjs",
  "node scripts/check-workspaces.mjs",
]

[tasks.check]
run = [
  "pnpm exec vp check --fix",
  "node scripts/sort-workspaces.mjs --fix",
  "node scripts/check-workspaces.mjs",
  "for d in $(jq -r '.workspaces[]' package.json); do (cd $d && mise check); done",
]

[tasks.update]
run = [
  "pnpm exec ncu --target minor -u --cooldown 7 --workspaces",
  "pnpm update --include-github-actions",
  "pnpm install",
  "node scripts/update-playwright-image.mjs",
  "pnpm exec playwright install --with-deps",
  "for d in $(jq -r '.workspaces[]' package.json); do (cd $d && mise update); done",
  "pnpm audit --audit-level critical",
  "pnpm exec skills update -y",
]
